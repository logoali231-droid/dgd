<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Don't Get Deactivated!</title>
    
    <!-- CSS -->
    <link rel="stylesheet" href="styles/variables.css">
    <link rel="stylesheet" href="styles/layout.css">
    <link rel="stylesheet" href="styles/components.css">
    
    <!-- Pixel font -->
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
</head>
<body>

    <div id="game-container">

        <!-- ============ HUD ============ -->
        <div id="hud">
            <div class="stat-box">
                <span class="label">Rating:</span>
                <span id="ui-rating">5.0</span>
            </div>
            <div class="stat-box">
                <span class="label">Energy:</span>
                <span id="ui-energy">100%</span>
            </div>
            <div class="stat-box">
                <span class="label">Battery:</span>
                <span id="ui-battery">100%</span>
            </div>
            <div class="stat-box">
                <span class="label">Cash:</span>
                <span id="ui-cash">$0.00</span>
            </div>
            <div class="stat-box">
                <span class="label">Shift:</span>
                <span id="ui-time">12:00:00</span>
            </div>
        </div>

        <!-- ============ GAME AREA ============ -->
        <div id="game-area">

            <!-- SCREEN: START -->
            <div id="screen-start" class="screen">
                <h1 id="game-state-text">Click to Start Shift</h1>
                <button id="start-btn">Start Shift</button>
            </div>

            <!-- SCREEN: DEACTIVATED (hidden by default) -->
            <div id="screen-deactivated" class="screen hidden">
                <h1 id="deactivated-title">DEACTIVATED</h1>
                <p id="deactivated-reason">Reason: #000</p>
                <p id="deactivated-text">Placeholder reason text...</p>
                <button id="restart-btn">Try Again</button>
            </div>

        </div>

    </div>

    <script type="module" src="main.js"></script>
</body>
</html>
